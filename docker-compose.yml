services:
  # Nosso banco de dados MySQL
  db:
    build:
      context: .
      dockerfile: db.Dockerfile
    container_name: phmetro_db
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: phmetro
      MYSQL_USER: graph
      MYSQL_PASSWORD: graphifrp@25198jcgbm
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DOCKER_DB_PORT:-3306}:3306"
    networks:
      - phmetro_net

  # Nosso servidor com PHP e o site
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phmetro_web
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      - db
    # volumes:
      # ATENÇÃO: Em produção (servidor), NÃO use volume de bind mount.
      # O Dockerfile já copia os arquivos com as permissões corretas via COPY + chown.
      # Descomente apenas para desenvolvimento local:
      # - ./:/var/www/html/
    ports:
      - "${DOCKER_WEB_PORT:-9002}:80"
    networks:
      - phmetro_net

volumes:
  db_data:

networks:
  phmetro_net:
    driver: bridge

